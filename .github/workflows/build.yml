name: Build Chrome and Firefox artifacts

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-chrome:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/assert-dist.mjs
      - run: bash scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-zip
          path: |
            releases/*.zip
            !releases/*.firefox.zip

  build-firefox:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:firefox
      - run: node scripts/assert-dist.mjs --firefox
      - run: bash scripts/pack.sh --firefox
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-zip
          path: releases/*.firefox.zip
